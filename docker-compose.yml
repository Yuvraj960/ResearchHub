version: '3.9'

services:
  # ─────────────────────────────────────────────
  # Redis — message broker for Celery
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: researchhub-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # PostgreSQL — production database
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: researchhub-postgres
    environment:
      POSTGRES_DB: researchhub
      POSTGRES_USER: ${POSTGRES_USER:-researchhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-researchhub_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-researchhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Flask Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchhub-backend
    command: python run.py
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT:-change-this-salt}
      DATABASE_URL: postgresql://${POSTGRES_USER:-researchhub}:${POSTGRES_PASSWORD:-researchhub_password}@postgres:5432/researchhub
      REDIS_URL: redis://redis:6379/0
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER}
      FRONTEND_URL: http://localhost:80
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app

  # ─────────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchhub-celery-worker
    command: celery -A celery_worker.celery worker --loglevel=info
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT:-change-this-salt}
      DATABASE_URL: postgresql://${POSTGRES_USER:-researchhub}:${POSTGRES_PASSWORD:-researchhub_password}@postgres:5432/researchhub
      REDIS_URL: redis://redis:6379/0
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app

  # ─────────────────────────────────────────────
  # Celery Beat (periodic task scheduler)
  # ─────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchhub-celery-beat
    command: celery -A celery_worker.celery beat --loglevel=info
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT:-change-this-salt}
      DATABASE_URL: postgresql://${POSTGRES_USER:-researchhub}:${POSTGRES_PASSWORD:-researchhub_password}@postgres:5432/researchhub
      REDIS_URL: redis://redis:6379/0
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app

  # ─────────────────────────────────────────────
  # Vue.js Frontend (nginx)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: researchhub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
